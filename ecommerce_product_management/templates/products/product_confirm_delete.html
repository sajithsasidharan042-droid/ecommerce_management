{% extends "base.html" %}
{% block title %}Delete Product | ShopAdmin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 text-center">
                <div class="display-5 mb-3">⚠️</div>
                <h2 class="h4 fw-bold">Delete Product?</h2>
                <p class="text-muted">
                    Are you sure you want to delete <strong>{{ product.name }}</strong>?
                    This action cannot be undone.
                </p>

                <form method="post" class="d-flex justify-content-center gap-2 mt-4">
                    {% csrf_token %}
                    <a href="{% url 'product_list' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
